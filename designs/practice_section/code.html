<!DOCTYPE html>

</head>
<body class="bg-[#111714]">
<div class="relative flex size-full min-h-screen flex-col dark group/design-root overflow-x-hidden" style='font-family: "Spline Sans", "Noto Sans", sans-serif;'>
<div class="layout-container flex h-full grow flex-col">

</div>
<h1 class="text-white text-xl font-bold leading-tight tracking-[-0.015em]">Math AI</h1>
</div>
<div class="flex flex-1 justify-end gap-4">
<button class="flex h-10 w-10 cursor-pointer items-center justify-center overflow-hidden rounded-full bg-[#29382f] text-white transition-colors hover:bg-[#3d5245]">
<span class="material-symbols-outlined"> menu </span>
</button>
<button>
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDzwqLre8NBwpSwWzEzNrd--HoNFug8acGIiKIVyMtJFI501kmDXZ0cI9yrTO64-GpKU0qxyEvvqfWiIj0wJ8VSYdAVNxk1-wfAJMeOZZcBeEmnllWifNdZZeY3IAYWR06RL2uGULQm7t55cBYtcF0v82Qq0yveuhrBrOGqnOhmQ6WChCnNlHAiuC209fA3hwoHEb4fKw7XY-oGrvbtRBFxckR9uIkCXJST9X6OcfJoV4UkfLf2Lbk5fthTq7-XWYsJObBLC1PTJ6U");'></div>
</button>
</div>
</header>
<main class="flex flex-1 justify-center py-10 px-4">
<div class="layout-content-container flex w-full max-w-2xl flex-col gap-8">
<div class="space-y-4 rounded-2xl bg-[#1c2620] p-6 shadow-lg">
<div class="space-y-2">
<h2 class="text-2xl font-bold text-white">Solve the following problem</h2>
<p class="text-lg text-gray-300">What is the derivative of f(x) = 3x² - 2x + 5?</p>
</div>
<div class="flex flex-col gap-4 sm:flex-row sm:items-end">
<div class="flex-1">
<label class="sr-only" for="answer">Enter your answer</label>
<input class="form-input w-full rounded-full border border-[#3d5245] bg-[#111714] px-4 py-3 text-white placeholder:text-[#9eb7a8] focus:border-[var(--primary-color)] focus:ring-[var(--primary-color)]" id="answer" placeholder="Enter your answer" value=""/>
</div>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center rounded-full bg-[var(--primary-color)] px-6 py-3 text-sm font-bold text-[#111714] transition-colors hover:bg-opacity-80">
<span class="truncate">Submit</span>
</button>
</div>
<div class="flex flex-col items-start gap-4 sm:flex-row sm:items-center">
<p class="text-sm font-medium text-yellow-400">Feedback: Incorrect. Try again or use a hint.</p>
<button class="flex cursor-pointer items-center justify-center rounded-full bg-[#29382f] px-4 py-2 text-sm font-bold text-white transition-colors hover:bg-[#3d5245]">
<span class="truncate">Get a Hint</span>
</button>
</div>
</div>
<div class="space-y-4 rounded-2xl bg-[#1c2620] p-6 shadow-lg">
<h3 class="text-lg font-bold text-white">Today's Progress</h3>
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between">
<p class="text-base font-medium text-white">Problems Solved</p>
<p class="text-sm font-normal text-gray-300">6/10</p>
</div>
<div class="h-2 w-full rounded-full bg-[#3d5245]">
<div class="h-2 rounded-full bg-[var(--primary-color)]" style="width: 60%;"></div>
</div>
<p class="text-right text-sm font-medium text-white">60%</p>
</div>
</div>
</div>
</main>
<div class="fixed bottom-8 right-8">
<button aria-label="Open AI Chat" class="flex h-16 w-16 cursor-pointer items-center justify-center rounded-full bg-[var(--primary-color)] text-[#111714] shadow-lg transition-transform hover:scale-105">
<span class="material-symbols-outlined text-3xl"> chat </span>
</button>
</div>
</div>
</div>

</body></html>
