<div class="layout-container flex h-full grow flex-col">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#29382f] px-10 py-3">
<div class="flex items-center gap-4 text-white">
<div class="size-6 text-[var(--primary-color)]">

</div>
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em]">Math AI</h2>
</div>
<div class="flex flex-1 justify-end gap-2">
<div class="flex items-center gap-2">
<a class="text-white/80 hover:text-white hover:bg-white/10 rounded-full px-4 py-2 text-sm font-medium leading-normal transition-colors" href="#">Home</a>
<a class="text-white/80 hover:text-white hover:bg-white/10 rounded-full px-4 py-2 text-sm font-medium leading-normal transition-colors" href="#">Features</a>
<a class="text-white/80 hover:text-white hover:bg-white/10 rounded-full px-4 py-2 text-sm font-medium leading-normal transition-colors" href="#">Pricing</a>
<a class="text-white/80 hover:text-white hover:bg-white/10 rounded-full px-4 py-2 text-sm font-medium leading-normal transition-colors" href="#">Support</a>
</div>
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 px-6 bg-white/10 text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-white/20 transition-colors">
<span class="truncate">Log In</span>
</button>
</div>
</header>
<main class="flex flex-1 justify-center py-5">
<div class="layout-content-container flex flex-col w-[512px] max-w-[512px] py-10 px-8">
<div class="flex flex-col gap-3 mb-8">
<p class="text-white/70 text-sm font-medium leading-normal">Step 1 of 5</p>
<div class="rounded-full bg-[#29382f] h-2">
<div class="h-2 rounded-full bg-[var(--primary-color)]" style="width: 20%;"></div>
</div>
</div>
<h1 class="text-white tracking-tighter text-4xl font-bold leading-tight text-center pb-8">Create your account</h1>
<form class="flex flex-col gap-4">
<label class="flex flex-col gap-2">
<p class="text-white text-base font-medium leading-normal">Full Name</p>
<input class="form-input" placeholder="Enter your full name" value=""/>
</label>
<label class="flex flex-col gap-2">
<p class="text-white text-base font-medium leading-normal">Email</p>
<input class="form-input" placeholder="Enter your email" type="email" value=""/>
</label>
<label class="flex flex-col gap-2">
<p class="text-white text-base font-medium leading-normal">Password</p>
<input class="form-input" placeholder="Create a password" type="password" value=""/>
</label>
<div class="grid grid-cols-2 gap-4">
<label class="flex flex-col gap-2">
<p class="text-white text-base font-medium leading-normal">Age</p>
<input class="form-input" placeholder="Enter your age" type="number" value=""/>
</label>
<label class="flex flex-col gap-2">
<p class="text-white text-base font-medium leading-normal">Education Level</p>
<select class="form-input appearance-none bg-[image:--select-button-svg] bg-no-repeat bg-[center_right_1rem] text-white/70">
<option value="one">Select level</option>
<option value="two">High School</option>
<option value="three">Undergraduate</option>
<option value="four">Postgraduate</option>
</select>
</label>
</div>
<label class="flex flex-col gap-2">
<p class="text-white text-base font-medium leading-normal">Math Goals</p>
<textarea class="form-input min-h-28" placeholder="e.g. Ace my calculus exam, understand linear algebra"></textarea>
</label>
<label class="flex items-center gap-x-3 py-3">
<input class="h-5 w-5 rounded border-[#3d5245] border-2 bg-transparent text-[var(--primary-color)] checked:bg-[var(--primary-color)] checked:border-[var(--primary-color)] checked:bg-[image:--checkbox-tick-svg] focus:ring-0 focus:ring-offset-0 focus:border-[#3d5245] focus:outline-none appearance-none" type="checkbox"/>
<p class="text-white text-sm font-normal leading-normal">
                I agree to the <a class="underline hover:text-[var(--primary-color)]" href="#">Terms of Service</a> and
                <a class="underline hover:text-[var(--primary-color)]" href="#">Privacy Policy</a>
</p>
</label>
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-12 px-5 mt-4 bg-[var(--primary-color)] text-[#111714] text-base font-bold leading-normal tracking-[0.015em] hover:opacity-90 transition-opacity">
<span class="truncate">Create Account</span>
</button>
<p class="text-[#9eb7a8] text-xs font-normal leading-normal pt-2 px-4 text-center">
              This site is protected by reCAPTCHA and the Google
              <a class="underline hover:text-white" href="#">Privacy Policy</a> and
              <a class="underline hover:text-white" href="#">Terms of Service</a> apply.
            </p>
</form>
</div>
</main>
</div>
